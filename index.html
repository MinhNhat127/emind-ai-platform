<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Mind Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Auth Screens (Company Selector & Login Screen) -->
  <div id="slot-auth"></div>

  <!-- Main App Shell -->
  <div class="app" id="main-app" style="display:none">
    <!-- Sidebars: Admin & Company -->
    <div id="slot-sidebars"></div>

    <div class="main">
      <!-- Main Header -->
      <div id="slot-header"></div>

      <!-- Main Content Pages -->
      <div class="content">
        <div id="slot-dashboard"></div>
        <div id="slot-contracts"></div>
        <div id="slot-projects"></div>
        <div id="slot-admin-views"></div>
      </div><!-- /content -->
    </div><!-- /main -->
  </div><!-- /app -->

  <!-- Modal Overlays -->
  <div id="slot-modals"></div>

  <!-- Dynamic Template & Component Loader -->
  <script src="js/template-loader.js"></script>
</body>

</html>
